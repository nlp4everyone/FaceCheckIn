<!DOCTYPE html>
<html>
<head>
    <title>Camera Feed</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: sans-serif;
        }

        .container {
            position: relative;
            width: 95vw;
            max-width: 1280px;
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            display: block;
        }

        .live-indicator {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 14px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .dot {
            height: 14px;
            width: 14px;
            background-color: red;
            border-radius: 50%;
            margin-right: 10px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0; }
        }

        .status-box {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            min-width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="live-indicator">
            <div class="dot"></div>
            <span>Live</span>
        </div>

        <!-- Status box: add emoji span -->
        <div id="status-text" class="status-box">
            <span id="status-emoji"></span>
            <span id="status-message">Please place your face inside a red area</span>
        </div>

        <canvas id="videoCanvas"></canvas>
    </div>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws");
        ws.binaryType = "arraybuffer";

        const canvas = document.getElementById("videoCanvas");
        const ctx = canvas.getContext("2d");
        const statusEmoji = document.getElementById("status-emoji");
        const statusMessage = document.getElementById("status-message");

        const rectWidth = {{ rect_width }};
        const rectHeight = {{ rect_height }};

        ws.onmessage = function(event) {
            // Check if message is JSON or binary image
            if (typeof event.data === "string") {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.status) {
                        // Update emoji and message separately for styling flexibility
                        statusEmoji.textContent = msg.emoji || "";
                        statusMessage.textContent = msg.status;

                        // Example: change background color based on message
                        if (msg.status.includes("Stop your motion")) {
                            statusMessage.parentElement.style.backgroundColor = "rgba(221, 120, 21, 0.9)";
                        } else if (msg.status.includes("Too quick")) {
                            statusMessage.parentElement.style.backgroundColor = "rgba(189, 26, 26, 0.9)";
                        } else {
                            statusMessage.parentElement.style.backgroundColor = "rgba(0, 0, 0, 0.8)";
                        }
                    }
                } catch (err) {
                    console.error("Failed to parse JSON:", err);
                }
                return;
            }

            // Binary image handling
            const blob = new Blob([event.data], { type: "image/jpeg" });
            const url = URL.createObjectURL(blob);
            const img = new Image();

            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;

                ctx.drawImage(img, 0, 0);

                const x = (img.width - rectWidth) / 2;
                const y = (img.height - rectHeight) / 2;

                ctx.beginPath();
                ctx.strokeStyle = "red";
                ctx.lineWidth = 4;
                ctx.rect(x, y, rectWidth, rectHeight);
                ctx.stroke();

                URL.revokeObjectURL(url);
            };

            img.src = url;
        };
    </script>
</body>
</html>
