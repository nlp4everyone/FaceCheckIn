<!DOCTYPE html>
<html>
<head>
    <title>Camera Feed</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: sans-serif;
        }

        .container {
            position: relative;
            width: 95vw;
            max-width: 1280px;
            margin: 0 auto;
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            display: block;
        }

        .live-indicator {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 14px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 1.5rem; /* 50% larger */
            font-weight: bold;
        }

        .dot {
            height: 14px;
            width: 14px;
            background-color: red;
            border-radius: 50%;
            margin-right: 10px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="live-indicator">
            <div class="dot"></div>
            <span>Live</span>
        </div>
        <img src="/video_feed" alt="Camera Feed" />
    </div>
</body>
</html>
